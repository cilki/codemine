<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codemine</title>
<style>
  /* Copper, following the cilki emblem palette's #c8__37 family. */
  :root { --accent: #c87137; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    color: #e8eaed;
    background-color: rgb(38, 42, 43);
    background-image:
      linear-gradient(rgba(56, 60, 63, 0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 60, 63, 0.5) 1px, transparent 1px);
    background-size: 80px 80px;
    min-height: 100vh;
  }
  .container { max-width: 1100px; min-height: 100vh; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  .header { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .header .emblem { height: 106px; display: block; max-width: 100%; object-fit: contain; }
  .disconnected { color: #e74c3c; font-size: 0.85em; }
  .panel {
    background: rgb(24, 26, 27);
    border: 1px solid rgb(62, 68, 70);
    border-radius: 8px;
    padding: 16px;
  }
  .panel-title { text-transform: uppercase; letter-spacing: 1px; font-size: 0.75em; color: #9aa0a6; margin-bottom: 10px; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .mono { font-family: "Courier New", monospace; }
  .muted { color: #9aa0a6; }
  .host-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .host-grid .stat-label { margin-bottom: 4px; }
  .host-value { font-family: "Courier New", monospace; font-size: 0.95em; word-break: break-word; }
  .log-buttons { display: flex; gap: 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat { background: rgb(24, 26, 27); border: 1px solid rgb(62, 68, 70); border-radius: 8px; padding: 12px 16px; }
  .stat-label { text-transform: uppercase; letter-spacing: 1px; font-size: 0.7em; color: #9aa0a6; }
  .stat-value { font-family: "Courier New", monospace; font-size: 1.4em; margin-top: 4px; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .columns { grid-template-columns: 1fr; } }
  #recent { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .turn { border: 1px solid rgb(62, 68, 70); border-radius: 6px; padding: 8px 10px; font-size: 0.9em; cursor: pointer; }
  .turn:hover { border-color: var(--accent); }
  .turn.selected { border-color: var(--accent); background: rgba(200, 113, 55, 0.08); }
  .turn-top { display: flex; justify-content: space-between; gap: 8px; }
  .turn-meta { color: #9aa0a6; font-size: 0.85em; margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .outcome { font-weight: bold; }
  .outcome.running { color: #2ecc71; }
  .outcome.running::before { content: "●"; margin-right: 6px; animation: pulse 1.5s infinite; }
  .outcome.paused { color: #e67e22; }
  .outcome.completed { color: #2ecc71; }
  .outcome.skipped { color: #9aa0a6; }
  .outcome.failed { color: #e74c3c; }
  .outcome.timeout { color: #e67e22; }
  .log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #log {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: 12px; line-height: 1.45; color: #b8bcbf;
    white-space: pre-wrap; word-break: break-word;
    max-height: 420px; overflow-y: auto;
  }

  /* Settings */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.75em; color: #9aa0a6; letter-spacing: 1px; }
  .field input, .field select {
    background: rgb(38, 42, 43); color: #e8eaed;
    border: 1px solid rgb(62, 68, 70); border-radius: 6px;
    padding: 7px 10px; font-size: 0.9em; font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .general-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .forges { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
  .forge { border: 1px solid rgb(62, 68, 70); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .forge-head { display: flex; align-items: center; justify-content: space-between; }
  .forge-head .name { font-weight: bold; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 0.85em; color: #9aa0a6; }
  .check input { accent-color: var(--accent); }
  .repos { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
  .repos .check { color: #e8eaed; font-size: 0.9em; }
  .repos .check.off { color: #9aa0a6; text-decoration: line-through; }
  button {
    background: rgb(62, 68, 70); color: #e8eaed; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 0.9em; font-family: inherit; cursor: pointer;
  }
  button:hover { background: rgb(78, 84, 87); }
  button.small { padding: 4px 10px; font-size: 0.8em; }
  .tasks { margin-top: 12px; }
  .tasks .checks-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px 12px;
  }
  .tasks .check { color: #e8eaed; font-size: 0.9em; }
  .tasks .check[title] { cursor: help; }
  .tasks .check.off { color: #9aa0a6; }
  /* Unrunnable settings are marked on the field that fixes them, so the
     collapsed panel has to advertise that there is something to fix. */
  .field input.invalid, .field select.invalid { border-color: #e74c3c; }
  .forges.invalid { outline: 1px solid #e74c3c; outline-offset: 8px; }
  details.panel.has-problems > summary { color: #e74c3c; }
  /* The settings float at the bottom of the screen: pushed to the end of
     the page when the content is short, pinned above the viewport edge
     while the rest scrolls. */
  #settings {
    position: sticky; bottom: 16px; margin-top: auto;
    max-height: calc(100vh - 32px); overflow-y: auto;
    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
  }
  details.panel > summary { cursor: pointer; margin-bottom: 0; }
  details.panel > summary::marker { color: #9aa0a6; }
  details.panel[open] > summary { margin-bottom: 10px; }
  #settings-status { font-size: 0.85em; margin-top: 16px; min-height: 1.2em; }
  #settings-status.saving { color: #9aa0a6; }
  #settings-status.ok { color: #2ecc71; }
  #settings-status.err { color: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="/emblem.svg" alt="codemine" class="emblem">
  </div>

  <div class="panel">
    <div class="panel-title log-head"><span>Host</span>
      <span class="disconnected" id="disconnected" hidden>disconnected</span></div>
    <div class="host-grid" id="host"><span class="muted">Loading…</span></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Today</div><div class="stat-value" id="stat-today">–</div></div>
    <div class="stat"><div class="stat-label">Turns</div><div class="stat-value" id="stat-turns">–</div></div>
    <div class="stat"><div class="stat-label">Completed</div><div class="stat-value" id="stat-completed">–</div></div>
    <div class="stat"><div class="stat-label">Skipped</div><div class="stat-value" id="stat-skipped">–</div></div>
    <div class="stat"><div class="stat-label">Failed</div><div class="stat-value" id="stat-failed">–</div></div>
    <div class="stat"><div class="stat-label">Tokens</div><div class="stat-value" id="stat-tokens">–</div></div>
  </div>

  <div class="columns">
    <div class="panel">
      <div class="panel-title">Recent turns</div>
      <div id="recent"><span class="muted">No turns yet.</span></div>
    </div>
    <div class="panel">
      <div class="panel-title log-head"><span id="log-title">Log</span>
        <span class="log-buttons">
          <button type="button" class="small" id="pause" hidden></button>
          <button type="button" class="small" id="log-live" hidden>back to live</button>
        </span></div>
      <pre id="log" class="muted"></pre>
    </div>
  </div>

  <details class="panel" id="settings">
    <summary class="panel-title">Settings</summary>
    <div class="general-grid">
      <div class="field"><label for="s-model">Model</label>
        <select id="s-model"></select>
      </div>
      <div class="field"><label for="s-daily-limit">Daily task limit (blank = unlimited)</label><input id="s-daily-limit" type="number" min="1"></div>
      <div class="field"><label for="s-author-name">Git author name</label><input id="s-author-name"></div>
      <div class="field"><label for="s-author-email">Git author email</label><input id="s-author-email"></div>
      <div class="field"><label for="s-timeout">Turn timeout (minutes)</label><input id="s-timeout" type="number" min="1"></div>
      <div class="field"><label for="s-nice">CPU priority</label>
        <select id="s-nice">
          <option value="high">high</option>
          <option value="normal">normal</option>
          <option value="low">low</option>
        </select>
      </div>
      <div class="field"><label for="s-ionice">I/O class</label>
        <select id="s-ionice">
          <option value="">full priority</option>
          <option value="best-effort">best-effort</option>
          <option value="idle">idle</option>
        </select>
      </div>
    </div>
    <div class="field tasks"><label>Tasks</label>
      <div class="checks-grid" id="s-tasks"></div>
    </div>
    <div class="forges" id="forges"></div>
    <div id="settings-status"></div>
  </details>
</div>

<script>
  const $ = id => document.getElementById(id);
  let state = null;

  const tokenTotal = t => t.input + t.output + t.reasoning + t.cache_read + t.cache_write;

  function fmtTokens(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  function fmtBytes(n) {
    const units = ["B", "KiB", "MiB", "GiB", "TiB"];
    let u = 0;
    while (n >= 1024 && u < units.length - 1) { n /= 1024; u++; }
    return (u ? n.toFixed(1) : n) + " " + units[u];
  }

  function fmtDuration(secs) {
    secs = Math.max(0, Math.round(secs));
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    if (h) return h + "h " + m + "m";
    if (m) return m + "m " + s + "s";
    return s + "s";
  }

  // Server time, extrapolated from the last response.
  const serverNow = () => state.now + (Date.now() - state.received) / 1000;

  // Outline every field the runner is waiting on, and clear the ones that
  // were fixed. Values are never touched, so this is safe to run on the
  // status poll while the form is being edited. Problems nothing in the form
  // can fix become the settings summary's tooltip.
  function markProblems(problems) {
    for (const marked of document.querySelectorAll(".invalid")) {
      marked.classList.remove("invalid");
      marked.title = "";
    }
    for (const problem of problems) {
      if (problem.field) {
        const el = $(problem.field);
        if (el) {
          el.classList.add("invalid");
          el.title = problem.message;
        }
      }
    }
    $("settings").classList.toggle("has-problems", problems.length > 0);
    $("settings").querySelector("summary").title =
      problems.filter(p => !p.field).map(p => p.message).join(" · ");
  }

  // The running turn's elapsed time advances on its own between events, so
  // it is redrawn on a local timer rather than waiting for the server to say
  // something.
  function renderClock() {
    const a = state.activity;
    const elapsed = $("running-elapsed");
    if (elapsed && a.state === "running") {
      elapsed.textContent = fmtDuration(serverNow() - a.started);
    }
  }

  function render() {
    const a = state.activity;
    markProblems(a.state === "unconfigured" ? a.problems : []);
    // The pause button lives with the log because it freezes the running
    // turn's process tree; without a turn there is nothing to signal.
    $("pause").hidden = a.state !== "running";
    $("pause").textContent = state.paused ? "resume" : "pause";
    renderClock();

    $("stat-today").textContent =
      state.completed_today + " / " + (state.daily_limit ?? "∞");
    $("stat-turns").textContent = state.totals.turns;
    $("stat-completed").textContent = state.totals.completed;
    $("stat-skipped").textContent = state.totals.skipped;
    $("stat-failed").textContent = state.totals.failed + state.totals.timeout;
    $("stat-tokens").textContent =
      state.totals.tokens && tokenTotal(state.totals.tokens)
        ? fmtTokens(tokenTotal(state.totals.tokens)) : "–";

    const rows = state.recent.map(turn => {
      const row = turnRow(turn.task + " on " + turn.repo, turn.outcome,
        turn.forge + " · " + new Date(turn.started * 1000).toLocaleString(),
        fmtDuration(turn.duration_secs) +
          (turn.tokens ? " · " + fmtTokens(tokenTotal(turn.tokens)) + " tokens" : ""));
      row.className = "turn" + (viewing === turn.started ? " selected" : "");
      // Clicking a turn shows its full log; clicking again goes back to live.
      row.onclick = () => viewing === turn.started ? viewLive() : viewTurn(turn);
      return row;
    });
    // The in-flight turn leads the list; its log is the live tail, so
    // clicking it goes there. The elapsed time ticks from renderClock.
    if (a.state === "running") {
      const row = turnRow(a.task + " on " + a.repo, state.paused ? "paused" : "running",
        a.forge + " · " + new Date(a.started * 1000).toLocaleString(), "");
      row.querySelector(".turn-meta").lastChild.id = "running-elapsed";
      row.onclick = viewLive;
      rows.unshift(row);
    }
    if (rows.length) $("recent").replaceChildren(...rows);
  }

  function turnRow(title, outcome, when, cost) {
    const row = document.createElement("div");
    row.className = "turn";
    const top = document.createElement("div");
    top.className = "turn-top";
    top.append(
      Object.assign(document.createElement("span"), { textContent: title }),
      Object.assign(document.createElement("span"),
        { className: "outcome " + outcome, textContent: outcome }));
    const meta = document.createElement("div");
    meta.className = "turn-meta";
    meta.append(
      Object.assign(document.createElement("span"), { textContent: when }),
      Object.assign(document.createElement("span"), { textContent: cost }));
    row.append(top, meta);
    return row;
  }

  // ---- Log rendering ----
  // Logs come off a terminal-oriented tool, so SGR escapes are rendered as
  // colors and everything else terminal-shaped (cursor moves, OSC titles) is
  // dropped.

  // The standard 16 colors, tuned for the dark background.
  const ANSI16 = [
    "#5c6370", "#e06c75", "#98c379", "#e5c07b", "#61afef", "#c678dd", "#56b6c2", "#d7dae0",
    "#7f848e", "#ff7a85", "#a9dc76", "#ffd866", "#78c6ff", "#d88fff", "#66d9e8", "#ffffff",
  ];

  function ansi256(n) {
    if (n < 16) return ANSI16[n];
    if (n < 232) {
      const level = i => (i ? i * 40 + 55 : 0);
      n -= 16;
      return `rgb(${level(Math.floor(n / 36))},${level(Math.floor(n / 6) % 6)},${level(n % 6)})`;
    }
    const gray = (n - 232) * 10 + 8;
    return `rgb(${gray},${gray},${gray})`;
  }

  function applySgr(style, params) {
    const codes = params.split(";").map(s => Number(s || "0"));
    for (let i = 0; i < codes.length; i++) {
      const code = codes[i];
      if (code === 0) Object.assign(style, { fg: null, bg: null, bold: false, dim: false, italic: false, underline: false });
      else if (code === 1) style.bold = true;
      else if (code === 2) style.dim = true;
      else if (code === 3) style.italic = true;
      else if (code === 4) style.underline = true;
      else if (code === 22) style.bold = style.dim = false;
      else if (code === 23) style.italic = false;
      else if (code === 24) style.underline = false;
      else if (code === 39) style.fg = null;
      else if (code === 49) style.bg = null;
      else if (code >= 30 && code <= 37) style.fg = ANSI16[code - 30];
      else if (code >= 90 && code <= 97) style.fg = ANSI16[code - 82];
      else if (code >= 40 && code <= 47) style.bg = ANSI16[code - 40];
      else if (code >= 100 && code <= 107) style.bg = ANSI16[code - 92];
      else if (code === 38 || code === 48) {
        // Extended colors: 38;5;n and 38;2;r;g;b, likewise for 48.
        const target = code === 38 ? "fg" : "bg";
        if (codes[i + 1] === 5) { style[target] = ansi256(codes[i + 2] ?? 0); i += 2; }
        else if (codes[i + 1] === 2) { style[target] = `rgb(${codes[i + 2] ?? 0},${codes[i + 3] ?? 0},${codes[i + 4] ?? 0})`; i += 4; }
        else break;
      }
    }
  }

  // Every escape sequence is consumed; only the SGR ones (first group) style
  // the text that follows.
  const ANSI_RE = /\x1b(?:\[([0-9;]*)m|\[[0-9;?]*[ -\/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)?|[@-Z\\-_])/g;

  function renderLog(el, text) {
    // A carriage return overwrites its line, the way spinners and progress
    // bars use it; only what each line ends up as is kept.
    text = text.replace(/\r\n/g, "\n").replace(/[^\n\r]*\r/g, "");
    const style = { fg: null, bg: null, bold: false, dim: false, italic: false, underline: false };
    const nodes = [];
    let last = 0;
    const flush = end => {
      if (end <= last) return;
      const chunk = text.slice(last, end);
      if (!style.fg && !style.bg && !style.bold && !style.dim && !style.italic && !style.underline) {
        nodes.push(document.createTextNode(chunk));
        return;
      }
      const span = document.createElement("span");
      if (style.fg) span.style.color = style.fg;
      if (style.bg) span.style.backgroundColor = style.bg;
      if (style.bold) span.style.fontWeight = "bold";
      if (style.dim) span.style.opacity = "0.6";
      if (style.italic) span.style.fontStyle = "italic";
      if (style.underline) span.style.textDecoration = "underline";
      span.textContent = chunk;
      nodes.push(span);
    };
    for (const match of text.matchAll(ANSI_RE)) {
      flush(match.index);
      last = match.index + match[0].length;
      if (match[1] !== undefined) applySgr(style, match[1]);
    }
    flush(text.length);
    el.replaceChildren(...nodes);
  }

  // The live tail, or a finished turn's full log when one is selected;
  // `viewing` holds the selected turn's start epoch, which is its identifier.
  let liveLog = "";
  let viewing = null;

  // Stay pinned to the bottom unless the reader has scrolled up to look at
  // something.
  function setLog(text) {
    liveLog = text;
    if (viewing !== null) return;
    const log = $("log");
    const follow = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    renderLog(log, text);
    if (follow) log.scrollTop = log.scrollHeight;
  }

  async function viewTurn(turn) {
    viewing = turn.started;
    $("log-title").textContent = "Log — " + turn.task + " on " + turn.repo;
    $("log-live").hidden = false;
    render();
    let text;
    try {
      const res = await fetch(`/api/turns/${turn.started}/log`);
      text = await res.text();
      if (!res.ok) throw new Error(text || res.status);
    } catch (err) {
      text = String(err.message || err);
    }
    // Ignore a fetch that finished after the reader moved on.
    if (viewing !== turn.started) return;
    renderLog($("log"), text);
    $("log").scrollTop = 0;
  }

  function viewLive() {
    viewing = null;
    $("log-title").textContent = "Log";
    $("log-live").hidden = true;
    render();
    setLog(liveLog);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function renderHost(h) {
    const memory = h.mem_total
      ? fmtBytes(h.mem_total - h.mem_available) + " / " + fmtBytes(h.mem_total) : "–";
    const items = [
      ["hostname", h.hostname || "–"],
      ["ip", h.ip || "–"],
      ["cpu", h.cpu_model ? h.cpu_model + " × " + h.cpus : h.cpus + " cpus"],
      ["memory", memory],
      ["cpu temp", h.temp_c == null ? "–" : Math.round(h.temp_c) + " °C"],
      ["uptime", fmtDuration(h.uptime_secs)],
      ["network", "↓ " + fmtBytes(h.rx_bytes) + " · ↑ " + fmtBytes(h.tx_bytes)],
    ];
    $("host").replaceChildren(...items.map(([label, value]) => {
      const item = document.createElement("div");
      item.append(
        Object.assign(document.createElement("div"),
          { className: "stat-label", textContent: label }),
        Object.assign(document.createElement("div"),
          { className: "host-value", textContent: value }));
      return item;
    }));
  }

  // The server pushes status on every change, and the log tail and host
  // details as they move; EventSource reconnects on its own, so a dropped
  // stream only shows up as the disconnected marker until it comes back.
  function listen() {
    const events = new EventSource("/api/events");
    events.addEventListener("status", event => {
      state = JSON.parse(event.data);
      state.received = Date.now();
      render();
    });
    events.addEventListener("log", event => setLog(JSON.parse(event.data)));
    events.addEventListener("host", event => renderHost(JSON.parse(event.data)));
    events.onopen = () => $("disconnected").hidden = true;
    events.onerror = () => $("disconnected").hidden = false;
  }

  // ---- Settings ----
  // The settings form loads once, never on the status poll, and every edit
  // saves itself; the form is not re-rendered afterwards, so a save can't
  // clobber whatever is being edited next.

  const FORGES = ["gitea", "github", "gitlab"];
  const URL_PLACEHOLDER = {
    gitea: "https://gitea.example.com",
    github: "https://github.com (default)",
    gitlab: "https://gitlab.com (default)",
  };
  // Per forge: Set of disabled repo names, edited by the checkboxes.
  const disabledRepos = {};

  // The fixed choices from /api/options: the models the runner can be pointed
  // at, and the task pool parsed out of the sweep command.
  let options = { models: [], tasks: [] };
  // The enabled tasks, edited by the checkboxes.
  const enabledTasks = new Set();

  // A stored value that is no longer on offer (a model we dropped, a task
  // slug an older sweep.md defined) is kept as an extra choice rather than
  // silently rewritten to something else.
  function renderModels(selected) {
    const ids = options.models.map(m => m.id);
    const extra = selected && !ids.includes(selected)
      ? [{ id: selected, label: `${selected} (not offered)` }] : [];
    $("s-model").replaceChildren(...[...options.models, ...extra].map(model =>
      Object.assign(document.createElement("option"),
        { value: model.id, textContent: model.label })));
    $("s-model").value = selected;
  }

  function taskRow(name, description) {
    const label = document.createElement("label");
    // The sweep command's own instructions for the task, as a hover tooltip.
    label.title = description;
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = enabledTasks.has(name);
    const paint = () => label.className = "check" + (box.checked ? "" : " off");
    box.onchange = () => {
      box.checked ? enabledTasks.add(name) : enabledTasks.delete(name);
      paint();
    };
    paint();
    label.append(box, document.createTextNode(name));
    return label;
  }

  function renderTasks(selected) {
    enabledTasks.clear();
    for (const task of selected) enabledTasks.add(task);
    const offered = new Map(options.tasks.map(t => [t.slug, t.description]));
    const extra = selected.filter(slug => !offered.has(slug))
      .map(slug => [slug, "not in the sweep command"]);
    $("s-tasks").replaceChildren(...[...offered, ...extra]
      .map(([slug, description]) => taskRow(slug, description)));
  }

  // Niceness is presented as a priority, since the numbers in between make no
  // practical difference to a background agent. A hand-edited config.json
  // lands on the nearest level and is rewritten to it on the next save.
  const NICE = { high: null, normal: 10, low: 19 };
  const nicePriority = nice =>
    nice == null ? "high" : nice <= 14 ? "normal" : "low";

  function forgeCard(name) {
    const card = document.createElement("div");
    card.className = "forge";
    card.innerHTML = `
      <div class="forge-head">
        <span class="name">${name}</span>
        <label class="check"><input type="checkbox" id="f-${name}-enabled"> enabled</label>
      </div>
      <div class="field"><label for="f-${name}-token">Token</label>
        <input id="f-${name}-token" type="password" autocomplete="off"></div>
      <div class="field"><label for="f-${name}-url">URL</label>
        <input id="f-${name}-url" placeholder="${URL_PLACEHOLDER[name]}"></div>
      ${name === "gitea" ? `
      <div class="field"><label for="f-gitea-user">User</label><input id="f-gitea-user"></div>` : ""}
      <div class="field"><label>Repositories</label>
        <div class="repos" id="f-${name}-repos"><span class="muted">Not loaded.</span></div>
        <span class="muted" id="f-${name}-repos-note"></span>
      </div>`;
    return card;
  }

  function repoRow(name, forge) {
    const label = document.createElement("label");
    label.className = "check" + (disabledRepos[forge].has(name) ? " off" : "");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !disabledRepos[forge].has(name);
    box.onchange = () => {
      box.checked ? disabledRepos[forge].delete(name) : disabledRepos[forge].add(name);
      label.className = "check" + (box.checked ? "" : " off");
    };
    label.append(box, document.createTextNode(name));
    return label;
  }

  function renderRepos(forge, names) {
    const rows = names.map(name => repoRow(name, forge));
    $(`f-${forge}-repos`).replaceChildren(
      ...(rows.length ? rows : [Object.assign(document.createElement("span"),
        { className: "muted", textContent: "No repositories." })]));
  }

  // Forges whose live listing already came in, so edits and saves don't
  // refetch it on every keystroke.
  const loadedRepos = new Set();

  async function loadRepos(forge) {
    const note = $(`f-${forge}-repos-note`);
    note.textContent = "loading…";
    try {
      const res = await fetch(`/api/repos/${forge}`);
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.status);
      note.textContent = "";
      loadedRepos.add(forge);
      renderRepos(forge, body.repos.map(r => r.name));
    } catch (err) {
      note.textContent = String(err.message || err);
    }
  }

  // Fetch each configured forge's repositories as soon as its settings allow
  // it: on page load, and again after a save makes a forge newly listable.
  function autoLoadRepos(s) {
    for (const forge of FORGES) {
      const f = s[forge];
      const listable = f.enabled && f.token_set
        && (forge !== "gitea" || (f.url && f.user));
      if (listable && !loadedRepos.has(forge)) loadRepos(forge);
    }
  }

  function renderSettings(s) {
    renderModels(s.model);
    renderTasks(s.tasks);
    $("s-daily-limit").value = s.daily_limit ?? "";
    $("s-author-name").value = s.author_name;
    $("s-author-email").value = s.author_email;
    $("s-timeout").value = Math.max(1, Math.round(s.turn_timeout_secs / 60));
    $("s-nice").value = nicePriority(s.nice);
    $("s-ionice").value = s.ionice ?? "";
    for (const forge of FORGES) {
      const f = s[forge];
      disabledRepos[forge] = new Set(f.disabled_repos);
      $(`f-${forge}-enabled`).checked = f.enabled;
      const token = $(`f-${forge}-token`);
      token.value = "";
      token.placeholder = f.token_set ? "token set — leave blank to keep" : "no token";
      $(`f-${forge}-url`).value = f.url;
      if (forge === "gitea") $("f-gitea-user").value = f.user;
      // Show the stored disables even before a live listing is loaded, so an
      // unreachable forge can't silently drop them.
      renderRepos(forge, [...disabledRepos[forge]].sort());
    }
    autoLoadRepos(s);
  }

  async function loadSettings() {
    const res = await fetch("/api/options");
    if (res.ok) options = await res.json();
    const settings = await fetch("/api/settings");
    if (settings.ok) renderSettings(await settings.json());
  }

  function settingsBody() {
    const num = value => value === "" ? null : Number(value);
    const minutes = num($("s-timeout").value);
    const body = {
      model: $("s-model").value,
      tasks: [...enabledTasks],
      daily_limit: num($("s-daily-limit").value),
      author_name: $("s-author-name").value,
      author_email: $("s-author-email").value,
      turn_timeout_secs: minutes === null ? 0 : minutes * 60,
      nice: NICE[$("s-nice").value] ?? null,
      ionice: $("s-ionice").value || null,
    };
    for (const forge of FORGES) {
      body[forge] = {
        enabled: $(`f-${forge}-enabled`).checked,
        // Empty means "keep the stored token"; the server never sends it back.
        token: $(`f-${forge}-token`).value,
        url: $(`f-${forge}-url`).value,
        user: forge === "gitea" ? $("f-gitea-user").value : "",
        disabled_repos: [...disabledRepos[forge]].sort(),
      };
    }
    return body;
  }

  // Edits save themselves. A save in flight sets `again` instead of racing a
  // second PUT, so the last edit always wins and the form is never rewritten
  // under the cursor.
  let timer = null, saving = false, again = false;

  function scheduleSave(delay) {
    clearTimeout(timer);
    timer = setTimeout(save, delay);
  }

  async function save() {
    clearTimeout(timer);
    if (saving) {
      again = true;
      return;
    }
    saving = true;
    const status = $("settings-status");
    status.className = "saving";
    status.textContent = "saving…";
    try {
      const res = await fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(settingsBody()),
      });
      const returned = await res.json();
      if (!res.ok) throw new Error(returned.error || res.status);
      // Tokens are write-only: once stored, drop what was typed and say so.
      for (const forge of FORGES) {
        const token = $(`f-${forge}-token`);
        if (token.value) {
          token.value = "";
          token.placeholder = returned[forge].token_set
            ? "token set — leave blank to keep" : "no token";
        }
      }
      status.className = "ok";
      status.textContent = "saved — applies from the next turn";
      // A save can make a forge newly listable (enabled, token stored).
      autoLoadRepos(returned);
    } catch (err) {
      status.className = "err";
      status.textContent = String(err.message || err);
    } finally {
      saving = false;
      if (again) {
        again = false;
        scheduleSave(0);
      }
    }
  }

  $("forges").append(...FORGES.map(forgeCard));
  // Delegated, so the repo and task checkboxes built later are covered too.
  // Typing debounces; committed choices save at once. Token fields are left
  // to `change` alone, so a partial secret is never stored.
  $("settings").addEventListener("input", event => {
    if (event.target.type !== "password") scheduleSave(600);
  });
  $("settings").addEventListener("change", () => scheduleSave(0));
  $("log-live").onclick = viewLive;
  // The new state comes right back over the event stream, which repaints the
  // button and badge; nothing to do here beyond sending the toggle.
  $("pause").onclick = () => fetch("/api/paused", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paused: !state.paused }),
  }).catch(() => {});
  loadSettings();

  setInterval(() => { if (state) renderClock(); }, 1000);
  listen();
</script>
</body>
</html>
