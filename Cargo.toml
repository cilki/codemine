[package]
authors = ["cilki"]
description = "Another software development harness"
edition = "2024"
license = "Unlicense"
name = "codemine"
repository = "https://github.com/cilki/codemine"
version = "0.1.0"

[dependencies]
anyhow = "1"
axum = "0.8"
fastrand = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net"] }
wait-timeout = "0.2"
