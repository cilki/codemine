[package]
authors = ["cilki"]
description = "Another software development harness"
edition = "2024"
license = "Unlicense"
name = "codemine"
repository = "https://github.com/cilki/codemine"
version = "0.2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
cilki = { version = "0.1.3", features = ["project-codemine"] }
fastrand = "2"
landlock = "0.4"
libc = "0.2"
# Only the blocking client, and rustls without its default provider: the
# default pulls aws-lc-rs, whose build wants cmake, while `ring` builds with
# the C compiler `rusqlite = ["bundled"]` already requires. `src/http.rs`
# installs the provider.
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls-no-provider",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.39.6", default-features = false, features = [
  "component",
  "disk",
  "system",
], optional = true }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wait-timeout = "0.2"

[features]
default = ["hostinfo"]
hostinfo = ["dep:sysinfo"]
