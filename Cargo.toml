[package]
authors = ["cilki"]
description = "Another software development harness"
edition = "2024"
license = "Unlicense"
name = "codemine"
repository = "https://github.com/cilki/codemine"
version = "0.1.0"

[dependencies]
anyhow = "1"
axum = "0.8"
fastrand = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wait-timeout = "0.2"
